<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <h1>Password Generator</h1>
        <div class="inputBox">
            <input type="text" class="PassBox" id="PassBox" disabled>
            <span class="material-symbols-outlined" id="copy">
                content_copy
            </span>
        </div>
        <input type="range" min="1" max="30" value="8" id="inputSlider">

        <div class="row">
            <p>password Length</p>
            <span id="slidervalue"></span>
        </div>

        <div class="row">
            <label for="lowercase">Include Lowercase Letter (a-z)</label>
            <input type="checkbox" name="lowercase" id="lowercase">
        </div>
        <div class="row">
            <label for="Uppercase">Include Uppercase Letter (A-Z)</label>
            <input type="checkbox" name="Uppercase" id="Uppercase">
        </div>
        <div class="row">
            <label for="Number">Include Number (0-9)</label>
            <input type="checkbox" name="Number" id="Number">
        </div>
        <div class="row">
            <label for="Symbol">Include Symbols (!-*)</label>
            <input type="checkbox" name="Symbol" id="Symbol">
        </div>

        <button type="button" class="genBtn" id="genBtn">Generator Password</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
